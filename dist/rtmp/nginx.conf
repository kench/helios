# rtmp-ingest (LLD 4, section 4): nginx with the RTMP module, run by helios-rtmp.service as user
# helios-rtmp. Cameras (the Osmo Pocket 3) publish to rtmp://<board>:1935/live/ingest, or
# ingest-1, ingest-2... for more cameras; the keys aren't secret, devices on the LAN are trusted,
# and the firewall limits port 1935 to the publisher networks. Each publish asks the Helios
# stream daemon (on_publish), which refuses keys no stream takes; the daemon reads ffmpeg's input
# back on loopback, and reads the statistics page at start and every 30 s. The ports must match
# [modules.stream.rtmp_ingest] in /etc/helios/helios.toml.
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;
worker_processes 1;
error_log stderr warn;
pid /run/helios-rtmp/nginx.pid;
events {
    worker_connections 128;
}

rtmp {
    # Without this the RTMP module opens nginx's compiled-in /var/log/nginx/access.log, which an
    # unprivileged nginx can't.
    access_log off;
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
            record off;
            allow publish all;
            # Only the daemon's ffmpeg plays, on loopback.
            allow play 127.0.0.1;
            deny play all;
            on_publish http://127.0.0.1:1936/rtmp/publish;
            on_publish_done http://127.0.0.1:1936/rtmp/publish_done;
            notify_method post;
            # A camera that drops off Wi-Fi without closing frees its key after 10 s.
            drop_idle_publisher 10s;
        }
    }
}

# The statistics page, on loopback only.
http {
    access_log off;
    # nginx's compiled-in temporary directories are under /var/lib/nginx: use the unit's own.
    client_body_temp_path /var/lib/helios-rtmp/body;
    proxy_temp_path /var/lib/helios-rtmp/proxy;
    fastcgi_temp_path /var/lib/helios-rtmp/fastcgi;
    uwsgi_temp_path /var/lib/helios-rtmp/uwsgi;
    scgi_temp_path /var/lib/helios-rtmp/scgi;
    server {
        listen 127.0.0.1:1937;
        location = /stat {
            rtmp_stat all;
        }
        location / {
            return 404;
        }
    }
}
