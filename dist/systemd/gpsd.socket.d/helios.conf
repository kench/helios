# Installed by the helios package (LLD 10): lets the helios group use gpsd's control socket, so
# Helios can ask gpsd to open the receiver in [modules.gps] device (as `gpsdctl add` does). gpsd's
# reports on 127.0.0.1:2947 are unchanged. The only extra power: adding and removing gpsd's
# devices.
[Socket]
SocketGroup=helios
SocketMode=0660
