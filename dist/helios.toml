# Helios config: /etc/helios/helios.toml (LLD 1, section 3). No secrets go in this file.
#
# This example gets the PIN and the device identity from the bootstrap service. For
# development without it, set identity.pin = "file:<path>" and fill in the settings marked
# "local PIN" below.

[bootstrap]
url        = "https://device-management.services.kenley.tv/v1"
ca         = "/etc/helios/amazon-root-cas.pem"   # same Amazon root CAs as aws.root_ca
interfaces = "auto"                              # or a list, e.g. ["eth0", "wlan0"]
timeout_ms = 10000
challenge_key_label = "challenge-key"            # optional PIN-less key for challenges

[device]
# Local PIN: required. With bootstrap, set only to cross-check the service's value.
# thing_name = "t-01JD5VY2K7M9Q4R6T8V0X2Z4B6"

[identity]
pkcs11_module = "/usr/lib/softhsm/libsofthsm2.so"   # scanner: /run/helios/lib/softhsm/libsofthsm2.so
# Local PIN: required. With bootstrap, supplied by the service.
# token_label = "helios"
# key_label   = "device-key"
certificate   = "token"          # "token" or a path to a PEM file
pin           = "bootstrap"      # "bootstrap", "credential:<name>" or "file:<path>"
allow_final_pin_try = false
sign_timeout_ms     = 5000

[aws]
# Local PIN: all four required. With bootstrap, supplied by the service; if set here, the
# service's values must match.
# region               = "us-west-2"
# iot_endpoint         = "<prefix>-ats.iot.us-west-2.amazonaws.com"
# credentials_endpoint = "<prefix>.credentials.iot.us-west-2.amazonaws.com"
# role_alias           = "helios-device-role-alias"
root_ca = "/etc/helios/amazon-root-cas.pem"   # AmazonRootCA1 + AmazonRootCA3

[mqtt]
# AWS IoT Core over MQTT 3.1.1 (LLD 2, section 6). The endpoint is aws.iot_endpoint, from the
# bootstrap service or the [aws] section above.
port           = 8883        # or 443 (ALPN x-amzn-mqtt-ca) where 8883 is blocked
keep_alive_s   = 60          # 30 to 1200
queue_messages = 1000        # events kept while offline; the oldest are dropped first
commands       = "topics"    # helios/<thing>/cmd|rsp/<module>; "aws-iot-commands" comes later
helios_shadow_interval_s = 60  # 10 to 86400: how often the helios shadow may be updated for
                               # changes that aren't urgent (urgent ones go at once)

[clock]
# Clock checks (LLD 1, section 4.11). Helios reports the clock in the helios shadow but never
# sets it. The platform may write /run/helios/boot-clock before NTP runs, for the boot offset.
warn_offset_s = 60           # warn when off from server time by more; error above 240 s

[modules.usb]
# USB devices arriving and leaving (LLD 5), from the kernel's uevents and sysfs: events
# usb.attached, usb.changed and usb.detached on helios/<thing>/evt/usb, the usb shadow, and the
# usb.status command. Needs a build with the module-usb Cargo feature; other builds log this
# section as unused. Needs no extra permissions. Devices present at start are only in the shadow.
enabled = true
settle_ms = 500                  # 50 to 5000: quiet time after a device's last event before it's
                                 # announced, so the event names its nodes (/dev/videoN, eth1, ...)
max_settle_ms = 10000            # settle_ms to 60000: announced by then at the latest
hubs = false                     # also report USB hubs
ignore = []                      # "vid:pid" or ports ("1-1.2"): tracked, not reported
max_events_per_port = 20         # attachments a minute before a port counts as flapping
mp_sd_mount = "/init/efad/mp_sd" # scanner: where the platform mounts the PROXdongl3 drive

[modules.stream]
# Video streams through ffmpeg to SRT listeners (LLD 4): directly, or bonded over several uplinks
# by srtla_send. Needs a build with the module-stream Cargo feature. Streams run in the stream
# daemon, helios-stream.service (`helios stream-daemon`, which reads this section too), so they
# keep going while Helios restarts; Helios is its client. Enable both services where it streams.
# Commands: stream.start, stream.stop, stream.status. No streams are configured here.
enabled = false
ffmpeg = "/usr/lib/helios-ffmpeg/bin/ffmpeg"
srtla_send = "/usr/bin/srtla_send"
belacoder = "/usr/bin/belacoder"   # GStreamer encoders, for profiles with encoder = belacoder
ceracoder = "/usr/bin/ceracoder"   # or ceracoder (adaptive bitrate)
gst_plugin_path = "/usr/lib/helios-gst/gstreamer-1.0"  # GST_PLUGIN_PATH for them: the Rockchip
                                   # plugin (helios-gst-rockchip-rk3588); "" for none
control_socket = "/run/helios-stream/control.sock"  # the daemon's; Helios connects here
state_dir = "/var/lib/helios-stream"  # the daemon saves the desired state here
client_user = "helios"             # who may use the control socket (besides root)
runtime_dir = "/run/helios-stream" # senders' IP files and control sockets go in <runtime_dir>/srtla
srtla_port_base = 6000             # srtla outputs get local ports from here, in name order
sender_idle_s = 60                 # 1 to 3600: how long a sender outlives its last stream
stats_interval_s = 30              # 5 to 3600: stream.stats while live

[modules.stream.rtmp_ingest]
# Cameras that publish RTMP (the Osmo Pocket 3) to rtmp://<board>:1935/live/ingest, or ingest-1,
# ingest-2... for more cameras: nginx in helios-rtmp.service (config /etc/helios/rtmp/nginx.conf,
# packages nginx and libnginx-mod-rtmp) asks the daemon about each publish. The keys aren't
# secret. These must match that nginx.conf.
enabled = false
port = 1935                        # nginx's RTMP port; jobs read streams back on loopback
hook_port = 1936                   # on_publish / on_publish_done, on 127.0.0.1
stat_url = "http://127.0.0.1:1937/stat"  # rtmp_stat, read at start and every 30 s

# [modules.stream.outputs.bonded]
# mode = "srtla"                   # srtla (to srtla_rec) or direct (to an SRT listener)
# host = "ingest.example.com"
# port = 5000
# latency_ms = 2000
# uplinks = ["usb:ethernet", "usb:cellular"]  # usb categories or interface names
# passphrase = "…"                 # 10 to 79 characters; SRT URLs aren't secrets
#
# [modules.stream.profiles.hevc]
# video = "hevc_rkmpp"             # copy, libx264, libx265, h264_rkmpp, hevc_rkmpp, h264_v4l2m2m
# bitrate_kbps = 6000              # stream.start may change it within min/max
# min_bitrate_kbps = 1000
# max_bitrate_kbps = 12000
# gop_s = 2                        # keyframe interval in seconds
# audio = "aac"                    # aac, none, or copy (RTMP sources)
# encoder = "ffmpeg"               # ffmpeg (fixed bitrate; a new one restarts it), belacoder or
#                                  # ceracoder (GStreamer: hevc_rkmpp, h264_rkmpp; belacoder
#                                  # also libx264). Passphrases need helios-packages' builds.
# bitrate_mode = "fixed"           # or adaptive (belacoder, ceracoder): min_bitrate_kbps up to
#                                  # the stream's bitrate, as the link allows; SIGHUP, no restart
# input = { format = "mjpeg", size = "1920x1080", fps = 30 }  # what to ask a camera for
#
# [modules.stream.streams.camera]
# source = { type = "camera", video = "usb:1-1.3", audio = "usb:1-1.3" }  # or { type = "test" }
# profile = "hevc"
# output = "bonded"
# streamid = "publish/live/backpack"
# desired = "live"
#
# [modules.stream.streams.pocket]
# source = { type = "rtmp" }       # key ingest; { type = "rtmp", camera = 1 } is ingest-1
# profile = "hevc"                 # with audio = "copy"; video = "copy" passes H.264 through
# output = "bonded"
# streamid = "publish/live/pocket"

[modules.display]
# Screens on a framebuffer (LLD 9): the scanner's 800x480 screen. Needs a build with the
# module-display Cargo feature; other builds log this section as unused. Needs the video group
# (/dev/fb0 is root:video) and the kernel's console detached from the framebuffer, which the
# scanner's autorun.sh does. Commands: display.show, display.clear, display.status.
enabled = false
framebuffer = "/dev/fb0"
idle_template = "status"           # status, blank or test; the display shadow's desired state
                                   # can set another, with fields
time_zone = "America/Los_Angeles"  # IANA name for the clock; default "UTC"
redraw_interval_s = 10             # 0 to 3600: redraws while the kernel's console is attached
# bold_font = "/run/helios/fonts/RoobertTW-Bold.otf"  # a font file for bold text, read at start,
                                   # for licensed fonts kept on the device rather than compiled in;
                                   # falls back to the built-in Noto Sans Bold if it can't be read
