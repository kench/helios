[package]
name = "helios"
version = "0.8.0"
edition = "2024"
publish = false
license = "CC0-1.0"
description = "Helios on-device agent for AWS IoT Core"

# The Debian package for the relay and transcoder boards (arm64), built by the release workflow
# with `cargo deb --target aarch64-unknown-linux-gnu --no-build` after a zigbuild for glibc 2.31.
[profile.release]
# Strip symbols at link time, for every target (cross builds included), so packaging needs no
# target-specific strip tool.
strip = true

[package.metadata.deb]
maintainer = "Kenley <kench@users.noreply.github.com>"
copyright = "Kenley"
section = "net"
priority = "optional"
extended-description = """\
The Helios on-device agent: connects the device to AWS IoT Core with a key held in a PKCS#11 \
token, reports its state, and runs its modules. The service is installed but not enabled: \
provision the device (config and token), then `systemctl enable --now helios`."""
depends = "libc6 (>= 2.31), adduser, softhsm2"
# gpsd: the gps module's source (LLD 10); Helios runs without it, and reports gpsd unavailable.
recommends = "unattended-upgrades, gpsd"
# helios-rtmp.service (rtmp-ingest) runs nginx with the RTMP module, on the boards that ingest
# RTMP; helios-firewall.service needs nft.
suggests = "nginx, libnginx-mod-rtmp, nftables"
assets = [
    ["target/release/helios", "usr/bin/", "755"],
    ["dist/systemd/helios.service", "lib/systemd/system/", "644"],
    ["dist/systemd/helios-stream.service", "lib/systemd/system/", "644"],
    ["dist/systemd/helios-rtmp.service", "lib/systemd/system/", "644"],
    ["dist/rtmp/nginx.conf", "etc/helios/rtmp/", "644"],
    ["dist/systemd/helios-firewall.service", "lib/systemd/system/", "644"],
    ["dist/systemd/helios-wifi.path", "lib/systemd/system/", "644"],
    ["dist/systemd/helios-wifi.service", "lib/systemd/system/", "644"],
    ["dist/systemd/gpsd.socket.d/helios.conf", "lib/systemd/system/gpsd.socket.d/", "644"],
    ["dist/nftables/helios.nft", "etc/helios/firewall.nft", "644"],
    ["dist/helios.toml", "usr/share/doc/helios/examples/", "644"],
    ["dist/debian/52helios-unattended-upgrades", "etc/apt/apt.conf.d/", "644"],
    ["README.md", "usr/share/doc/helios/", "644"],
]
maintainer-scripts = "dist/debian/"

[dependencies]
aws-credential-types = { version = "1.3.1", default-features = false }
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
cryptoki = "0.10.1"
fontdue = { version = "0.9.5", optional = true }
getrandom = "0.4.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-zoneinfo"], optional = true }
libc = "0.2.191"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "net", "process", "termios", "time"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
secrecy = { version = "0.8.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
x509-parser = "0.18.1"

[features]
# Device modules (HLD section 6.1), off by default so each device's build carries only the
# modules it uses. The scanner: --features module-display. CI checks every combination it
# builds (--all-features and --no-default-features).
default = []
# The display module (LLD 9): screens on a framebuffer.
module-display = ["dep:fontdue", "dep:jiff"]
module-usb = []
# The stream module (LLD 4): video streams through ffmpeg. Cameras come from the usb module.
module-stream = ["module-usb", "tokio/process", "tokio/io-util"]
# The net module (LLD 3): network interfaces, addresses and default routes, over rtnetlink.
module-net = []
# The gps module (LLD 10): the position, from gpsd. Boards only.
module-gps = ["tokio/io-util"]

[dev-dependencies]
bytes = "1.12.1"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "pty", "termios"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# Lints from HLD section 12 (Rust Style Guide plus Google's Rust style guide).
# CI runs `cargo clippy --all-targets --all-features -- -D warnings`.
[lints.rust]
# Allowed only in the small `sys` module, with `// SAFETY:` comments.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
borrowed_box = "warn"
len_without_is_empty = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
new_without_default = "warn"
ptr_arg = "warn"
should_implement_trait = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
wildcard_imports = "warn"
wrong_self_convention = "warn"
